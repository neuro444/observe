name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8 (syntax errors only — no style config exists yet)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.git

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuroheart
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cost_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroheart -d cost_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://neuroheart:test@localhost:5432/cost_ledger
      COST_INGEST_SECRET: test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/cost-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/cost-engine
          pip install -r apps/cost-api/requirements-dev.txt

      - name: Apply migrations
        run: python infra/migrations/run_migrations.py "$DATABASE_URL"

      - name: Run tests
        run: |
          python -m pytest packages/cost-engine/tests apps/cost-api/tests -v
