[project]
name = "cost-engine"
version = "0.1.0"
description = "Decimal-precision cost calculation against the price_book table."
requires-python = ">=3.11"
dependencies = ["psycopg2-binary>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cost_engine"]
