services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroheart-cost-db
    environment:
      POSTGRES_USER: neuroheart
      POSTGRES_PASSWORD: dev_only_change_in_real_deployment
      POSTGRES_DB: cost_ledger
    ports:
      - "127.0.0.1:5433:5432"   # non-default host port to avoid clashing with any local Postgres
    volumes:
      - neuroheart_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroheart -d cost_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neuroheart_pg_data:
